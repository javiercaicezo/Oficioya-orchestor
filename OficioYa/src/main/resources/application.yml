spring:
  application:
    name: oficioya
  profiles:
    active: local
  datasource:
    # Valores por defecto SOLO para desarrollo local (docker-compose.yml).
    # En cualquier otro ambiente se sobrescriben con variables de entorno.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/oficioya}
    username: ${DB_USER:oficioya}
    password: ${DB_PASSWORD:oficioya}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo crea Flyway; Hibernate solo valida que las entidades coincidan.
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
jwt:
  # Valores por defecto SOLO para desarrollo local. En otro ambiente se define JWT_SECRET.
  secret: ${JWT_SECRET:SCjI88KP8mrWTZ5F7rYfcx549mjwPcQP/hdZ0GsU3J6uQZdP3DKP/I1uO7KsVFTU}
  expiration:
    ms: 1800000